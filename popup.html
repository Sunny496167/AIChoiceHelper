<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Choice Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <div class="logo-section">
          <div class="logo">✨</div>
          <div>
            <h1>AI Choice Helper</h1>
            <div class="subtitle">Instant MCQ solutions powered by AI</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="content">
      <div class="section">
        <div class="section-title">AI Provider</div>
        <div class="form-group">
          <label for="api-provider">Choose your AI model</label>
          <select id="api-provider">
            <option value="groq">Groq (Beta/LPU)</option>
            <option value="gemini">Gemini (Google)</option>
            <option value="deepseek">DeepSeek</option>
            <option value="perplexity">Perplexity</option>
          </select>
        </div>
      </div>
      
      <div class="divider"></div>
      
      <div class="section">
        <div class="section-title">API Source</div>
        
        <div class="radio-group form-group">
          <label class="radio-label">
            <input type="radio" name="api-mode" value="builtin" id="mode-builtin">
            <span>Built-in API Keys</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="api-mode" value="custom" id="mode-custom">
            <span>Custom API Key</span>
          </label>
        </div>

        <div id="builtin-section" class="mode-section">
          <div class="form-group">
            <label for="builtin-key-selector">Select Built-in API</label>
            <select id="builtin-key-selector">
              <!-- Dynamically populated -->
            </select>
          </div>
          
          <div class="form-group checkbox-group">
            <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text);">
              <input type="checkbox" id="auto-switch-enabled" style="width: auto; margin: 0; cursor: pointer;">
              <span>Auto Switch On Failure</span>
            </label>
          </div>

          <details class="admin-panel" style="margin-top: 16px; border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: var(--secondary);">
            <summary style="font-weight: 600; font-size: 13px; cursor: pointer; color: var(--text-light); outline: none;">Built-in API Keys (Admin)</summary>
            <div id="builtin-admin-list" class="admin-list" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
              <!-- Dynamically populated -->
            </div>
          </details>
        </div>

        <div id="custom-section" class="mode-section" style="display: none;">
          <div class="form-group">
            <label for="custom-api-key">Custom API Key</label>
            <div class="input-wrapper">
              <input type="password" id="custom-api-key" placeholder="Enter your own key...">
              <div class="input-icon toggle-password" data-target="custom-api-key">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="divider"></div>
      
      <div class="section">
        <div class="section-title">Display Settings</div>
        
        <div class="form-group">
          <label for="notification-position">Notification Position</label>
          <select id="notification-position">
            <option value="center">Center</option>
            <option value="top-left">Top Left</option>
            <option value="top-right">Top Right</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="bottom-right">Bottom Right</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="notification-opacity">Notification Opacity: <span id="opacity-value">0.9</span></label>
          <input type="range" id="notification-opacity" min="0.1" max="1" step="0.1" value="0.9">
        </div>
        
        <div class="form-group">
          <label for="display-duration">Display Duration: <span id="duration-value">3</span> seconds</label>
          <input type="range" id="display-duration" min="1" max="10" step="1" value="3">
        </div>
      </div>
      
      <div class="divider"></div>
      
      <div class="section">
        <div class="section-title">Question Type</div>
        <div class="form-group">
          <label for="question-type">Select the type of question</label>
          <select id="question-type">
            <option value="mcq">Multiple Choice Question (MCQ)</option>
            <option value="explain">Explain</option>
            <option value="short-answer">Short Answer (30 words)</option>
            <option value="long-answer">Long Answer (70 words)</option>
            <option value="word-meaning">Word Meaning & Explanation</option>
          </select>
        </div>
      </div>
      
      <button id="save-button" class="button">💾 Save Settings</button>
      <div id="status" class="status success">✓ Settings saved successfully!</div>
    </div>
    
    <div class="footer">
      <div class="shortcut-info">
        <div class="shortcut-item">
          ⌨️ Keyboard: <span class="kbd">Ctrl+Shift</span> + <span class="kbd">Q</span>
        </div>
        <div class="shortcut-item">
          🖱️ Right-click: Select "Get AI answer"
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="popup.js"></script>
</body>
</html>
