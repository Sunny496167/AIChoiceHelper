<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Choice Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <div class="logo-section">
          <div class="logo">✨</div>
          <div>
            <h1>AI Choice Helper</h1>
            <div class="subtitle">Instant MCQ solutions powered by AI</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="content">
      <div class="section">
        <div class="section-title">AI Provider</div>
        <div class="form-group">
          <label for="api-provider">Choose your AI model</label>
          <select id="api-provider">
            <option value="openai">ChatGPT (OpenAI)</option>
            <option value="gemini">Gemini (Google)</option>
            <option value="deepseek">DeepSeek</option>
            <option value="perplexity">Perplexity</option>
          </select>
        </div>
      </div>
      
      <div class="divider"></div>
      
      <div class="section">
        <div class="section-title">API Keys</div>
        <div class="api-grid">
          <div class="api-card">
            <div class="api-header">
              <div class="api-icon icon-openai">🤖</div>
              <div class="api-name">OpenAI</div>
            </div>
            <div class="input-wrapper">
              <input type="password" id="openai-key" placeholder="sk-...">
              <div class="input-icon" onclick="togglePassword('openai-key')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </div>
            </div>
          </div>
          
          <div class="api-card">
            <div class="api-header">
              <div class="api-icon icon-gemini">💎</div>
              <div class="api-name">Gemini</div>
            </div>
            <div class="input-wrapper">
              <input type="password" id="gemini-key" placeholder="AIza...">
              <div class="input-icon" onclick="togglePassword('gemini-key')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </div>
            </div>
          </div>
          
          <div class="api-card">
            <div class="api-header">
              <div class="api-icon icon-deepseek">🔥</div>
              <div class="api-name">DeepSeek</div>
            </div>
            <div class="input-wrapper">
              <input type="password" id="deepseek-key" placeholder="sk-...">
              <div class="input-icon" onclick="togglePassword('deepseek-key')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </div>
            </div>
          </div>
          
          <div class="api-card">
            <div class="api-header">
              <div class="api-icon icon-perplexity">🌊</div>
              <div class="api-name">Perplexity</div>
            </div>
            <div class="input-wrapper">
              <input type="password" id="perplexity-key" placeholder="pplx-...">
              <div class="input-icon" onclick="togglePassword('perplexity-key')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="divider"></div>
      
      <div class="section">
        <div class="section-title">Display Settings</div>
        
        <div class="form-group">
          <label for="notification-position">Notification Position</label>
          <select id="notification-position">
            <option value="center">Center</option>
            <option value="top-left">Top Left</option>
            <option value="top-right">Top Right</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="bottom-right">Bottom Right</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="notification-opacity">Notification Opacity: <span id="opacity-value">0.9</span></label>
          <input type="range" id="notification-opacity" min="0.1" max="1" step="0.1" value="0.9">
        </div>
        
        <div class="form-group">
          <label for="display-duration">Display Duration: <span id="duration-value">3</span> seconds</label>
          <input type="range" id="display-duration" min="1" max="10" step="1" value="3">
        </div>
      </div>
      
      <div class="divider"></div>
      
      <div class="section">
        <div class="section-title">Question Type</div>
        <div class="form-group">
          <label for="question-type">Select the type of question</label>
          <select id="question-type">
            <option value="mcq">Multiple Choice Question (MCQ)</option>
            <option value="explain">Explain</option>
            <option value="short-answer">Short Answer (30 words)</option>
            <option value="long-answer">Long Answer (70 words)</option>
            <option value="word-meaning">Word Meaning & Explanation</option>
          </select>
        </div>
      </div>
      
      <button id="save-button" class="button">💾 Save Settings</button>
      <div id="status" class="status success">✓ Settings saved successfully!</div>
    </div>
    
    <div class="footer">
      <div class="shortcut-info">
        <div class="shortcut-item">
          ⌨️ Keyboard: <span class="kbd">Ctrl</span> + <span class="kbd">Q</span>
        </div>
        <div class="shortcut-item">
          🖱️ Right-click: Select "Get AI answer"
        </div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
